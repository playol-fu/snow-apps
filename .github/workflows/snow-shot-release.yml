name: Build Snow Shot EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*_snow-shot"

permissions:
  contents: read

concurrency:
  group: snow-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native Windows ${{ matrix.architecture }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025-vs2026
            preset: snow-shot-msvc-release
            rust-target: x86_64-pc-windows-msvc
            qt-kit: msvc2026_64-static-system-codecs
            installed-root: .tools/vcpkg/installed/static
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.tools\vcpkg-binary-cache,readwrite
      SNOW_ARCHITECTURE: ${{ matrix.architecture }}
      SNOW_PRESET: ${{ matrix.preset }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow toolchain detection
        shell: pwsh
        run: |
          python scripts/test-workflow-toolchain.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow toolchain regression test failed.' }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Install Python build helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check virtualenv

      - name: Verify Qt source downloader
        shell: pwsh
        run: |
          python scripts/test-static-qt-download.py
          if ($LASTEXITCODE -ne 0) { throw "Qt source downloader regression test failed." }

      - name: Identify installed build toolchain
        id: toolchain
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          $bin = Add-SnowMsvcToolsToPath -Architecture $env:SNOW_ARCHITECTURE
          $compilerHash = (Get-FileHash (Join-Path $bin 'cl.exe') -Algorithm SHA256).Hash
          [IO.Directory]::CreateDirectory((Join-Path $PWD '.tools/vcpkg-binary-cache')) | Out-Null
          $cmakeCommand = Get-Command cmake -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $cmakeOutput = & $cmakeCommand.Source --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify CMake.' }
          $cmakeVersion = ($cmakeOutput | Select-Object -First 1) -replace '[^a-zA-Z0-9.-]', '-'
          "fingerprint=$compilerHash-$env:WindowsSDKVersion-$cmakeVersion".Replace('\', '') >> $env:GITHUB_OUTPUT

      - name: Prepare repository-managed vcpkg checkout
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '.tools/vcpkg'
          # Version overrides need historical port trees from the full repository.
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare repository-local vcpkg.' }

      - name: Restore static project dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.installed-root }}
          key: snow-static-dependencies-v1-${{ matrix.architecture }}-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'scripts/bootstrap.ps1', 'scripts/snow-build-environment.ps1', 'cmake/vcpkg-overlay-triplets/**', 'cmake/vcpkg-overlay-ports/**') }}

      - name: Restore completed vcpkg package archives
        id: vcpkg-binaries
        uses: actions/cache/restore@v4
        with:
          path: .tools/vcpkg-binary-cache
          key: snow-vcpkg-binaries-v1-${{ matrix.architecture }}-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            snow-vcpkg-binaries-v1-${{ matrix.architecture }}-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            snow-crates -> ../build/${{ matrix.preset }}/cargo
            snow_draw_engine_qt -> ../build/${{ matrix.preset }}/cargo
            snow_rust_ffi -> ../build/${{ matrix.preset }}/cargo
          cache-on-failure: true

      - name: Install static project dependencies
        id: dependency-setup
        shell: pwsh
        run: |
          $dependencyArguments = @{}
          if ('${{ steps.dependencies.outputs.cache-hit }}' -eq 'true') {
            $dependencyArguments.SkipDependencyInstall = $true
          }
          .\scripts\bootstrap.ps1 -Architecture $env:SNOW_ARCHITECTURE -VcpkgVariants Static -SkipQtValidation @dependencyArguments
          if ($LASTEXITCODE -ne 0) { throw 'Static project dependency setup failed.' }

      - name: Preserve completed packages even after dependency setup fails
        if: always() && steps.vcpkg-binaries.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && steps.dependency-setup.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .tools/vcpkg-binary-cache
          key: ${{ steps.vcpkg-binaries.outputs.cache-primary-key }}

      - name: Save static project dependencies immediately
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.installed-root }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Resolve repository Qt toolchain
        id: qt-toolchain
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          "version=$script:SnowQtVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache static Qt kit
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\${{ steps.qt-toolchain.outputs.version }}\${{ matrix.qt-kit }}
          key: snow-qt-static-system-codecs-v6-development-${{ steps.qt-toolchain.outputs.version }}-msvc2026-${{ matrix.architecture }}-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/build-static-qt.ps1', 'scripts/snow-build-environment.ps1', 'scripts/static-qt-features.json', 'scripts/qtbase-timezone-without-cldr.patch', 'scripts/bootstrap.ps1', 'vcpkg.json', 'cmake/vcpkg-overlay-triplets/*-windows-static.cmake', 'cmake/vcpkg-overlay-ports/zlib/**') }}

      - name: Prepare Qt LTS static kit
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          $prefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\$script:SnowQtVersion\${{ matrix.qt-kit }}"
          $dependencies = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.installed-root }}/$env:SNOW_ARCHITECTURE-windows-static"
          & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -Architecture $env:SNOW_ARCHITECTURE -InstallPrefix $prefix -DependencyPrefix $dependencies -DevelopmentModules
          if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
          $qtDir = Join-Path $prefix "lib\cmake\Qt6"
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt $script:SnowQtVersion static CMake package was not found at $qtDir"
          }
          "SNOW_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save static Qt kit immediately
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\${{ steps.qt-toolchain.outputs.version }}\${{ matrix.qt-kit }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Verify native Qt timezone behavior
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          Add-SnowMsvcToolsToPath -Architecture $env:SNOW_ARCHITECTURE | Out-Null
          cmake -S test-support/qt-timezone -B build/qt-timezone-size -G Ninja -DCMAKE_BUILD_TYPE=Release "-DQt6_DIR=$env:Qt6_DIR" "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/${{ matrix.installed-root }}/$env:SNOW_ARCHITECTURE-windows-static"
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone test configuration failed." }
          cmake --build build/qt-timezone-size --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone test build failed." }
          ctest --test-dir build/qt-timezone-size -R '^snow-qt-timezone-tests$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Qt timezone behavior tests failed." }

      - name: Prepare NSIS packaging compiler on the runner
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE '.tools'
          $archive = Join-Path $tools 'nsis-3.11.zip'
          $expected = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
          $mirrors = @(
            'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip',
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
          )
          $verified = $false
          foreach ($mirror in $mirrors) {
            try {
              Invoke-WebRequest -Uri $mirror -OutFile $archive -TimeoutSec 120 -UserAgent 'Mozilla/5.0'
              $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
              if ($actual -ne $expected) { throw "NSIS archive checksum mismatch: $actual" }
              $verified = $true
              break
            } catch {
              Write-Warning "NSIS mirror failed ($mirror): $_"
            }
          }
          if (-not $verified) { throw 'No verified NSIS portable archive could be downloaded.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force
          $nsis = Join-Path $tools 'nsis-3.11'
          & (Join-Path $nsis 'makensis.exe') /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compiler verification failed.' }
          $nsis >> $env:GITHUB_PATH

      - name: Verify portable NSIS installer tooling
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          Add-SnowMsvcToolsToPath -Architecture $env:SNOW_ARCHITECTURE | Out-Null
          & scripts/test-snow-shot-installer.ps1 -Architecture $env:SNOW_ARCHITECTURE
          & scripts/test-snow-shot-installer-i18n.ps1
          & scripts/test-snow-shot-installer-i18n.ps1 -Edition Mini

      - name: Build, audit, and package statically
        shell: pwsh
        run: .\scripts\stage-snow-shot-release.ps1 -Architecture $env:SNOW_ARCHITECTURE

      - name: Locate packages
        id: package
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(SNOW_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v${version}_snow-shot") {
            throw "Unexpected release tag: $env:GITHUB_REF_NAME"
          }
          $names = @()
          foreach ($prefix in @('snow-shot', 'snow-shot-mini')) {
            $variants = if ($prefix -eq 'snow-shot-mini') { @('online') } else { @('online', 'offline') }
            foreach ($variant in $variants) {
              $base = "$prefix-$version-windows-${{ matrix.architecture }}-$variant"
              $names += @("$base.exe", "$base.exe.sha256", "$base.manifest.json",
                "$base-update.zip", "$base-update.zip.sha256", "$base-update.manifest.json")
            }
            $base = "$prefix-$version-windows-${{ matrix.architecture }}-portable"
            $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          }
          $descriptor = if ($env:SNOW_ARCHITECTURE -eq 'arm64') { 'snow_shot/packaging/snow-shot-ocr-asset-manifest-arm64.json' } else { 'snow_shot/packaging/snow-shot-ocr-asset-manifest.json' }
          $runtime = (Get-Content -Raw $descriptor | ConvertFrom-Json).runtime.version
          $base = "snow-ocr-runtime-$runtime-windows-$env:SNOW_ARCHITECTURE"
          $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          $packages = @($names | ForEach-Object { Get-Item -LiteralPath "build/${{ matrix.preset }}/$_" -ErrorAction Stop })
          $packages += @(Get-ChildItem build/${{ matrix.preset }}/native-validation -Filter '*.native-validation.json' -File)
          if (@($packages | Where-Object Name -like '*.native-validation.json').Count -ne 8) { throw 'Missing final package native validation evidence.' }
          $assets = ($packages | ForEach-Object { $_.FullName }) -join "`n"
          "assets<<SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preserve matching release symbols separately
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-symbols-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            build/${{ matrix.preset }}/snow-shot-symbols-windows-${{ matrix.architecture }}.zip
            build/${{ matrix.preset }}/snow-shot-symbols-windows-${{ matrix.architecture }}.zip.sha256
            build/${{ matrix.preset }}/snow-shot-mini-symbols-windows-${{ matrix.architecture }}.zip
            build/${{ matrix.preset }}/snow-shot-mini-symbols-windows-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Preserve final packages and native validation manifests
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-packages-${{ matrix.architecture }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error

      - name: Verify focused updater and installer behavior
        shell: pwsh
        run: |
          . scripts/snow-build-environment.ps1
          $null = Set-SnowBuildEnvironment -Preset $env:SNOW_PRESET
          python scripts/test-release-optimization.py
          if ($LASTEXITCODE -ne 0) { throw "Release optimization policy tests failed." }
          python scripts/test-release-optimization-pch.py --architecture $(if ($env:SNOW_ARCHITECTURE -eq 'arm64') { 'ARM64' } else { 'x64' }) --toolset "version=14.51"
          if ($LASTEXITCODE -ne 0) { throw "Mixed optimization precompiled-header tests failed." }
          python scripts/test-snow-shot-mini-package.py
          if ($LASTEXITCODE -ne 0) { throw "Full/Mini compression configuration tests failed." }
          python -m unittest discover -s ant_design_qt/tools/tests -p test_generate_icon_pack.py
          if ($LASTEXITCODE -ne 0) { throw "Icon pack generator tests failed." }
          & scripts/test-static-qt-features.ps1
          python scripts/test-qt-cmake-contract.py
          if ($LASTEXITCODE -ne 0) { throw "Qt toolchain CMake contract tests failed." }
          python scripts/test-qt-translation-release.py
          if ($LASTEXITCODE -ne 0) { throw "Qt stock-dialog translation tests failed." }
          & scripts/test-performance-qt-environment.ps1
          & scripts/test-qt-shader-contract.ps1
          & scripts/test-snow-shot-package-compression.ps1
          python scripts/test-snow-shot-gitee-release.py
          if ($LASTEXITCODE -ne 0) { throw "Gitee mirror tests failed." }
          node scripts/test-macos-installer-parser.js
          if ($LASTEXITCODE -ne 0) { throw "macOS installer parser tests failed." }
          & scripts/test-snow-shot-github-release.ps1
          & scripts/test-snow-shot-arm64-distribution.ps1
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --lib service::tests
          if ($LASTEXITCODE -ne 0) { throw "Updater fallback tests failed." }
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --lib github::tests
          if ($LASTEXITCODE -ne 0) { throw "GitHub transport tests failed." }
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --lib gitee::tests
          if ($LASTEXITCODE -ne 0) { throw "Gitee transport tests failed." }
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --test service_protocol
          if ($LASTEXITCODE -ne 0) { throw 'Updater architecture and service protocol tests failed.' }
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --test uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Updater uninstall and installer bootstrap tests failed.' }
          cargo test --manifest-path snow_shot/rust/snow-shot-updater/Cargo.toml --features mini --test uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Mini updater uninstall and installer bootstrap tests failed.' }
          & scripts/test-snow-shot-ocr-release-runtime.ps1
          & scripts/test-snow-shot-release-symbols.ps1 -Architecture $env:SNOW_ARCHITECTURE -ReleaseHelperPath build/${{ matrix.preset }}/snow_shot/Release/snow-shot-updater.exe
          & scripts/test-snow-shot-release-symbols.ps1 -Architecture $env:SNOW_ARCHITECTURE -Edition Mini -ReleaseHelperPath build/${{ matrix.preset }}/snow_shot_mini/Release/snow-shot-mini-updater.exe
          & scripts/test-snow-shot-installer-upgrade.ps1 -Architecture $env:SNOW_ARCHITECTURE -HelperPath build/${{ matrix.preset }}/snow_shot/Release/snow-shot-updater.exe
          & scripts/test-snow-shot-installer-upgrade.ps1 -Architecture $env:SNOW_ARCHITECTURE -Edition Mini -HelperPath build/${{ matrix.preset }}/snow_shot_mini/Release/snow-shot-mini-updater.exe
          & scripts/test-snow-shot-mini-release.ps1
          cmake --preset $env:SNOW_PRESET -DSNOW_SHOT_BUILD_UPDATE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "Updater test configuration failed." }
          cmake --build --preset "build-$env:SNOW_PRESET" --target snow-shot-update-adapter-tests snow-shot-macos-update-tests snow-shot-update-about-tests snow-shot-update-settings-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Updater test build failed." }
          ctest --test-dir build/${{ matrix.preset }}/snow_shot -C Release -R '^snow-shot-(update-(adapter-tests|about-tests|settings-tests)|macos-update-tests)$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Updater tests failed." }
          & scripts/test-snow-shot-update-helper.ps1 -Architecture $env:SNOW_ARCHITECTURE -HelperPath build/${{ matrix.preset }}/snow_shot/Release/snow-shot-updater.exe

      - name: Validate final package payloads on the matching native host
        shell: pwsh
        run: |
          ./scripts/test-snow-shot-native-package.ps1 -Architecture $env:SNOW_ARCHITECTURE `
            -BuildDirectory build/${{ matrix.preset }}

      - name: Verify focused native architecture functionality
        shell: pwsh
        run: |
          . ./scripts/snow-build-environment.ps1
          $null = Set-SnowBuildEnvironment -Preset $env:SNOW_PRESET
          cmake --preset $env:SNOW_PRESET -DSNOW_APPS_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native functional test configuration failed.' }
          cmake --build --preset "build-$env:SNOW_PRESET" --parallel 4 --target `
            snow-shot-clipboard-content-tests snow-shot-direct-capture-native-tests `
            snow-shot-capture-worker-tests snow-shot-screen-recording-controller-tests `
            snow-shot-diagnostics-crash-tests snow-shot-ocr-recognition-service-tests snow-shot-ocr-assets-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native functional test build failed.' }
          ctest --test-dir build/${{ matrix.preset }}/snow_shot -C Release --output-on-failure --no-tests=error `
            -R '^snow-shot-(clipboard-content|direct-capture-native|capture-worker|recording-post-processing|diagnostics-crash|ocr-(cpu-recognition-service|directml-recognition-service|managed-runtime|managed-directml-runtime|crash|assets))-tests$'
          if ($LASTEXITCODE -ne 0) { throw 'Native architecture functional tests failed.' }
